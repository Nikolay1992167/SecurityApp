plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.2'
	id 'io.spring.dependency-management' version '1.1.4'
	id "io.freefair.lombok" version "8.4"
}

group = 'com.solbeg'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

ext {
	hipersistenceVersion ='3.5.1'
	openapiVersion = '2.1.0'
	jjwtVersion = '0.11.5'
	mapstructVersion = '1.5.5.Final'
	hypersistenceVersion = '3.7.3'
	postgresqlContainersVersion = '1.19.3'
	assertJVersion = '3.24.2'
	mockWebserver = '4.12.0'
	set('springCloudVersion', "2023.0.2")
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation project(':logging-starter')
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation "io.hypersistence:hypersistence-utils-hibernate-62:${hypersistenceVersion}"
	implementation "org.springframework.boot:spring-boot-starter-validation"
	implementation "org.springframework.boot:spring-boot-starter-data-jpa"
	implementation "org.springframework.boot:spring-boot-starter-web"
	implementation "org.springframework.boot:spring-boot-starter-security"
	implementation "org.springframework.boot:spring-boot-configuration-processor"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openapiVersion}"

	implementation "org.springframework.boot:spring-boot-starter-data-redis"

	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	annotationProcessor "org.hibernate.orm:hibernate-jpamodelgen"

	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"

	implementation "org.liquibase:liquibase-core"
	runtimeOnly "org.postgresql:postgresql"

	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation "org.springframework.security:spring-security-test"
	testImplementation "org.testcontainers:postgresql:${postgresqlContainersVersion}"
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}